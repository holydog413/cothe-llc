<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="COTHE LLC sales team login." /><meta name="robots" content="noindex" />
  <title>Sales login — COTHE LLC</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>.q-panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow);margin:2rem 0}.q-field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.75rem}.q-field input{padding:.55rem;border:1px solid var(--line);border-radius:8px;font:inherit}.q-field input[type=checkbox]{display:inline;width:auto}</style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../">
        <div class="brand-mark">CTL</div>
        <div>COTHE LLC<span>Network security assessments</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="../#services">Services</a></li>
        <li><a href="./">Sales login</a></li>
        <li><a href="../#faq">FAQ</a></li>
        <li><a href="../#contact">Contact</a></li>
        <li><a class="btn btn-primary" href="../authorize/">Authorize testing</a></li>
      </ul>
    </div>
  </header>

  <main id="app">
    <section>
      <div class="container" style="max-width:440px">
        <div class="q-panel" id="loginBox">
          <h2 style="margin-top:0">Sales team login</h2>
          <p class="muted">The quote builder is for the COTHE LLC sales team. Customers: please <a href="../#contact">contact us for a quote</a>.</p>
          <form id="loginForm" autocomplete="on">
            <div class="q-field"><label for="u">Your name (shown as sales rep on quotes)</label><input id="u" name="username" autocomplete="username" minlength="2" required /></div>
            <div class="q-field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required /></div>
            <div class="q-field"><label><input type="checkbox" id="remember" /> Remember me (this browser tab session only)</label></div>
            <button class="btn btn-primary" id="loginBtn" type="submit">Unlock quote builder</button>
            <p id="err" role="alert" style="color:#b91c1c;font-weight:600;min-height:1.2em"></p>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-row">
      <span>© <span id="yr"></span> COTHE LLC</span>
      <a href="../">Home</a>
    </div>
  </footer>

  <script>
(function(){
  var SK="cothe_sales_key", RK="cothe_sales_rep", blob=null;
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  function getBlob(){ if(blob) return Promise.resolve(blob);
    return fetch("quote.enc.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("load");return r.json()}).then(function(j){return blob=j}); }
  function derive(pw,b){ var e=new TextEncoder();
    return crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){
      return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(b.salt),iterations:b.iter},k,{name:"AES-GCM",length:256},true,["decrypt"]);});}
  function decrypt(key,b){ return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(b.iv)},key,b64(b.ct)).then(function(pt){return JSON.parse(new TextDecoder().decode(pt))}); }
  function run(p){
    var st=document.createElement("style"); st.textContent=p.css; document.head.appendChild(st);
    var app=document.getElementById("app"); app.innerHTML=p.html;
    var bar=document.createElement("div"); bar.className="container"; bar.style.cssText="display:flex;justify-content:flex-end;padding-top:1rem";
    bar.innerHTML='<button class="btn btn-secondary" id="logout" type="button">Log out</button>'; app.insertBefore(bar,app.firstChild);
    document.getElementById("logout").onclick=function(){ try{sessionStorage.removeItem(SK);sessionStorage.removeItem(RK)}catch(e){} location.reload(); };
    p.js.forEach(function(code){ var s=document.createElement("script"); s.textContent=code; document.body.appendChild(s); });
    document.documentElement.setAttribute("data-unlocked","1");
  }
  var err=document.getElementById("err"), btn=document.getElementById("loginBtn");
  document.getElementById("loginForm").addEventListener("submit",function(ev){
    ev.preventDefault(); err.textContent=""; btn.disabled=true; btn.textContent="Unlocking…";
    var u=document.getElementById("u").value.trim().replace(/\s+/g," "), pw=document.getElementById("p").value, rem=document.getElementById("remember").checked;
    var fail=function(){ err.textContent="Incorrect password."; btn.disabled=false; btn.textContent="Unlock quote builder"; };
    if(u.length<2){ err.textContent="Enter your name (at least 2 characters)."; btn.disabled=false; btn.textContent="Unlock quote builder"; return; }
    window.COTHE_SALES_REP=u;
    getBlob().then(function(b){ return derive(pw,b).then(function(key){ return decrypt(key,b).then(function(p){
      if(rem){ return crypto.subtle.exportKey("raw",key).then(function(raw){ try{sessionStorage.setItem(SK,btoa(String.fromCharCode.apply(null,new Uint8Array(raw))));sessionStorage.setItem(RK,u)}catch(e){} return p; }); }
      return p; }); }); }).then(run).catch(fail);
  });
  try{ var saved=sessionStorage.getItem(SK); if(saved){ window.COTHE_SALES_REP=sessionStorage.getItem(RK)||""; getBlob().then(function(b){
      return crypto.subtle.importKey("raw",b64(saved),{name:"AES-GCM"},false,["decrypt"]).then(function(k){return decrypt(k,b)}); })
    .then(run).catch(function(){ sessionStorage.removeItem(SK); sessionStorage.removeItem(RK); }); } }catch(e){}
  document.getElementById("yr").textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
